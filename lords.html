<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#101827">
<title>Lords of Kingdom — Worldwar</title>
<style>
:root{--bg:#0b1220;--panel:#141f31;--panel2:#1b2a40;--line:#2c405b;--gold:#f4c96b;--text:#edf3fb;--muted:#9fb0c6;--green:#74d6a0;--red:#ff8d8d;--blue:#82b9ff}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#0b1220,#111c2c 60%,#0b1220);color:var(--text);font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}button{font:inherit;cursor:pointer;border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#263954;color:var(--text)}button:active{transform:scale(.98)}button:disabled{opacity:.4;cursor:not-allowed}.primary{background:#7c5b1f;border-color:#b58a39;color:#fff3d0}.good{background:#1e513f;border-color:#32795d}.danger{background:#572e37;border-color:#82434e}.wrap{max-width:1100px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:15px;border:1px solid var(--line);background:#111c2ddd;border-radius:14px}.brand{font-size:21px;font-weight:900;color:var(--gold);letter-spacing:.3px}.sub{font-size:12px;color:var(--muted)}.resources{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;margin:12px 0}.res,.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px}.res b{display:block;font-size:16px}.res span{color:var(--muted);font-size:12px}.tabs{display:flex;gap:7px;overflow-x:auto;padding:3px 0 10px}.tabs button{white-space:nowrap;flex:0 0 auto}.tabs button.active{background:#735421;border-color:var(--gold);color:#fff3d0}.layout{display:grid;grid-template-columns:1.2fr .8fr;gap:12px}.section-title{font-size:17px;font-weight:800;margin:0 0 10px}.muted{color:var(--muted)}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.stack{display:grid;gap:9px}.item{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px}.item h3{font-size:14px;margin:0 0 4px}.item p{margin:4px 0;color:var(--muted);font-size:12px}.item .actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.badge{display:inline-block;padding:3px 7px;border-radius:99px;background:#263954;color:#cfe2ff;font-size:11px}.gold{color:var(--gold)}.green{color:var(--green)}.red{color:var(--red)}.bar{height:6px;background:#0b1422;border-radius:9px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,#a8792d,#f4c96b)}.log{max-height:360px;overflow:auto;display:grid;gap:7px}.logline{padding:8px 10px;border-radius:8px;background:#0e1827;border:1px solid #22334a;font-size:12px}.footer{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;color:var(--muted);font-size:12px}.empty{text-align:center;padding:25px;color:var(--muted)}.notice{border:1px solid #725c2e;background:#332b19;padding:10px;border-radius:10px;color:#f6dfaa;font-size:12px;margin-bottom:10px}table{width:100%;border-collapse:collapse;font-size:12px}td,th{text-align:left;padding:8px;border-bottom:1px solid var(--line)}th{color:var(--muted)}@media(max-width:680px){.wrap{padding:9px}.resources{grid-template-columns:repeat(3,minmax(0,1fr))}.layout{grid-template-columns:1fr}.brand{font-size:18px}.res{padding:9px}.res b{font-size:14px}}
</style>
</head>
<body><div class="wrap">
<header class="top"><div><div class="brand">♜ LORDS OF KINGDOM</div><div class="sub">Strategi kerajaan berbasis teks • Worldwar</div></div><div style="text-align:right"><div id="dayLabel" class="gold">Hari 1 • Tahun 1</div><div id="kingLabel" class="sub">Kerajaan Pemula</div></div></header>
<div class="resources" id="resources"></div>
<nav class="tabs" id="tabs"></nav>
<main id="view"></main>
<div class="footer"><span id="saveStatus">Penyimpanan lokal aktif</span><div><button id="saveBtn">Simpan</button> <button id="resetBtn" class="danger">Mulai Ulang</button></div></div>
</div>
<script>
(()=>{
const $=s=>document.querySelector(s);
const fmt=n=>Math.floor(n).toLocaleString('id-ID');
const BUILDINGS=[
{id:'castle',name:'Kastil',icon:'🏰',desc:'Pusat kerajaan. Membuka batas perkembangan kerajaan.',cost:{wood:120,stone:100,ore:35,gold:100},base:1},
{id:'farm',name:'Pertanian',icon:'🌾',desc:'Menghasilkan makanan setiap hari.',cost:{wood:45,stone:15,gold:20},base:1},
{id:'lumber',name:'Kamp Penebang',icon:'🪵',desc:'Menghasilkan kayu setiap hari.',cost:{wood:30,stone:10,gold:15},base:1},
{id:'quarry',name:'Tambang Batu',icon:'🪨',desc:'Menghasilkan batu setiap hari.',cost:{wood:35,stone:10,gold:15},base:1},
{id:'mine',name:'Tambang Bijih',icon:'⛏️',desc:'Menghasilkan bijih setiap hari.',cost:{wood:40,stone:15,gold:20},base:1},
{id:'barracks',name:'Barak',icon:'🪖',desc:'Meningkatkan kapasitas dan efisiensi pelatihan pasukan.',cost:{wood:65,stone:35,gold:30},base:1},
{id:'academy',name:'Akademi',icon:'📚',desc:'Membuka riset teknologi kerajaan.',cost:{wood:70,stone:45,ore:15,gold:45},base:0},
{id:'hospital',name:'Rumah Sakit',icon:'🏥',desc:'Menyelamatkan sebagian pasukan yang terluka.',cost:{wood:55,stone:50,gold:35},base:0},
{id:'warehouse',name:'Gudang',icon:'📦',desc:'Meningkatkan kapasitas penyimpanan sumber daya.',cost:{wood:55,stone:30,gold:25},base:1}
];
const UNITS=[
{id:'infantry',name:'Infanteri',icon:'🛡️',cost:{food:3,wood:1,gold:2},power:3,upkeep:1,desc:'Barisan depan yang seimbang.'},
{id:'archer',name:'Pemanah',icon:'🏹',cost:{food:3,wood:2,gold:2},power:3.2,upkeep:1,desc:'Serangan jarak jauh, efektif dari barisan belakang.'},
{id:'cavalry',name:'Kavaleri',icon:'🐎',cost:{food:5,ore:1,gold:4},power:5,upkeep:2,desc:'Cepat dan kuat untuk serangan mendobrak.'},
{id:'siege',name:'Pengepungan',icon:'⚙️',cost:{food:4,wood:4,ore:3,gold:6},power:6,upkeep:2,desc:'Efektif untuk menyerang kastil dan benteng.'}
];
const RESEARCH=[
{id:'drill',name:'Latihan Militer',desc:'+8% kekuatan pasukan per level.',cost:{wood:80,ore:35,gold:100},max:5},
{id:'farming',name:'Rotasi Tanaman',desc:'+15% produksi makanan per level.',cost:{wood:70,stone:25,gold:70},max:5},
{id:'logistics',name:'Logistik Kerajaan',desc:'+10% kapasitas gudang per level.',cost:{wood:90,stone:55,gold:90},max:3},
{id:'medicine',name:'Kedokteran Medan',desc:'+5% pasukan kembali dari korban perang per level.',cost:{wood:60,ore:25,gold:100},max:5}
];
const GEN_NAMES=['Aldric','Seraphina','Kael','Mira','Darian','Lyra','Roderick','Nadia','Theron','Elara','Cassian','Freya'];
const ENEMY_NAMES=['Valoria','Drakenfall','Eldermarch','Ravenhold','Stormhaven','Ironcrest','Duskmoor','Goldwyn'];
const TABS=[['kingdom','🏰 Kerajaan'],['army','⚔️ Militer'],['generals','🎖️ Jenderal'],['research','🔬 Riset'],['world','🌍 Dunia'],['guild','🏴 Guild'],['reports','📜 Laporan']];
const fresh=()=>({version:1,day:1,kingdom:'Kerajaan Pemula',res:{food:650,wood:500,stone:420,ore:180,gold:900},buildings:{castle:1,farm:1,lumber:1,quarry:1,mine:1,barracks:1,academy:0,hospital:0,warehouse:1},units:{infantry:250,archer:150,cavalry:60,siege:12},wounded:0,generals:[{id:1,name:'Aldric',rank:'Marsekal',level:3,xp:0,attack:12,defense:10,loyalty:90,assigned:'army'},{id:2,name:'Seraphina',rank:'Jenderal',level:2,xp:0,attack:10,defense:8,loyalty:85,assigned:'none'}],nextGen:3,research:{},enemies:Array.from({length:36},(_,i)=>({id:i+1,name:(ENEMY_NAMES[i%ENEMY_NAMES.length]+(Math.floor(i/ENEMY_NAMES.length)?' '+(Math.floor(i/ENEMY_NAMES.length)+1):'')),power:Math.floor(650+i*185+Math.pow(i,1.45)*28),wealth:600+i*150,territory:1+Math.floor(i/5),relation:i<3?'Netral':'Waspada',lastBattle:null})),territories:1,guild:{name:'',members:0,level:1,contribution:0},reports:['Hari 1: Kerajaan baru berdiri. Bangun ekonomi dan siapkan pasukan.'],tasks:[],activeTab:'kingdom',lastTick:Date.now()});
let S;try{S=JSON.parse(localStorage.getItem('lordsKingdomSave'))||fresh();if(!S.res||!S.buildings)S=fresh()}catch{S=fresh()}
function save(){S.lastTick=Date.now();localStorage.setItem('lordsKingdomSave',JSON.stringify(S));$('#saveStatus').textContent='Tersimpan • '+new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});}
function log(msg){S.reports.unshift('Hari '+S.day+': '+msg);S.reports=S.reports.slice(0,100)}
function power(){let p=UNITS.reduce((a,u)=>a+(S.units[u.id]||0)*u.power,0);let gen=S.generals.filter(g=>g.assigned==='army').reduce((a,g)=>a+g.attack*2+g.defense,0);return Math.floor((p+gen)*(1+(S.research.drill||0)*.08))}
function cap(){return 1500+S.buildings.warehouse*1800+(S.research.logistics||0)*3000}
function costText(c){return Object.entries(c).map(([k,v])=>({food:'🍖',wood:'🪵',stone:'🪨',ore:'⛏️',gold:'🪙'}[k]+' '+fmt(v))).join(' · ')}
function canPay(c){return Object.entries(c).every(([k,v])=>(S.res[k]||0)>=v)}
function pay(c){if(!canPay(c))return false;Object.entries(c).forEach(([k,v])=>S.res[k]-=v);return true}
function addRes(k,n){S.res[k]=Math.max(0,Math.min(cap(),(S.res[k]||0)+n))}
function tick(){S.day++;const b=S.buildings;addRes('food',b.farm*95*(1+(S.research.farming||0)*.15));addRes('wood',b.lumber*75);addRes('stone',b.quarry*55);addRes('ore',b.mine*28);addRes('gold',Math.max(25,b.castle*22+b.barracks*5));let upkeep=UNITS.reduce((a,u)=>a+(S.units[u.id]||0)*u.upkeep,0);S.res.food=Math.max(0,S.res.food-upkeep);if(S.res.food===0&&upkeep>0){Object.keys(S.units).forEach(k=>S.units[k]=Math.max(0,Math.floor(S.units[k]*.98)));log('Persediaan makanan habis. Sebagian pasukan meninggalkan barisan.')}S.wounded=Math.max(0,S.wounded-Math.floor(S.buildings.hospital*18));if(S.day%3===0)aiTurn();if(S.day%7===0)log('Pekan baru dimulai. Produksi kerajaan dan konsumsi pasukan telah diperhitungkan.');S.lastTick=Date.now()}
function aiTurn(){S.enemies.forEach(e=>{e.power=Math.max(500,Math.floor(e.power*(1+(Math.random()*.08-.025))));e.wealth=Math.max(100,e.wealth+Math.floor(Math.random()*180-40));if(Math.random()<.13){e.territory++;log(e.name+' memperluas wilayahnya.')}if(Math.random()<.10){const target=S.enemies[Math.floor(Math.random()*S.enemies.length)];if(target.id!==e.id){e.power=Math.max(400,e.power-70);target.power=Math.max(400,target.power-55)}}});if(Math.random()<.12)log('Pengintai melaporkan kerajaan-kerajaan tetangga sedang memperkuat militer.')}
function advance(n=1){for(let i=0;i<n;i++)tick();render()}
function resourceHeader(){$('#resources').innerHTML=[['food','🍖 Makanan'],['wood','🪵 Kayu'],['stone','🪨 Batu'],['ore','⛏️ Bijih'],['gold','🪙 Emas']].map(([k,l])=>'<div class="res"><span>'+l+'</span><b>'+fmt(S.res[k])+'</b></div>').join('');$('#dayLabel').textContent='Hari '+S.day+' • Tahun '+(Math.floor((S.day-1)/365)+1);$('#kingLabel').textContent=S.kingdom+' • '+S.territories+' wilayah'}
function tabs(){ $('#tabs').innerHTML=TABS.map(([id,label])=>'<button data-tab="'+id+'" class="'+(S.activeTab===id?'active':'')+'">'+label+'</button>').join('');$('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{S.activeTab=b.dataset.tab;render()})}
function card(title,body){return '<section class="card"><h2 class="section-title">'+title+'</h2>'+body+'</section>'}
function item(title,desc,extra,actions=''){return '<div class="item"><div class="row"><h3>'+title+'</h3>'+extra+'</div><p>'+desc+'</p>'+ (actions?'<div class="actions">'+actions+'</div>':'')+'</div>'}
function button(label,act,disabled=false,cls=''){return '<button class="'+cls+'" data-act="'+act+'" '+(disabled?'disabled':'')+'>'+label+'</button>'}
function kingdom(){let buildings=BUILDINGS.map(b=>{let lv=S.buildings[b.id]||0,cost=Object.fromEntries(Object.entries(b.cost).map(([k,v])=>[k,Math.ceil(v*(1+lv*.72))]));let disabled=!canPay(cost)||(b.id!=='castle'&&lv>=S.buildings.castle+2);return item(b.icon+' '+b.name+' <span class="badge">Lv. '+lv+'</span>',b.desc+'<br><span class="muted">Biaya peningkatan: '+costText(cost)+'</span>',lv===0?'<span class="badge">Belum dibangun</span>':'<span class="gold">Aktif</span>',button(lv===0?'Bangun':'Tingkatkan', 'build:'+b.id,disabled,'primary'))}).join('');return '<div class="layout">'+card('🏰 Bangunan Kerajaan','<div class="stack">'+buildings+'</div>')+card('📊 Ringkasan Kerajaan','<div class="stack">'+item('Kekuatan militer','Total kekuatan efektif pasukan dan bonus jenderal.','<b class="gold">'+fmt(power())+'</b>')+item('Wilayah dikuasai','Wilayah yang berada di bawah kendali kerajaan.','<b>'+S.territories+'</b>')+item('Pasukan terluka','Dapat dipulihkan melalui rumah sakit dan waktu.','<b>'+fmt(S.wounded)+'</b>')+item('Kapasitas gudang','Batas maksimum setiap sumber daya.','<b>'+fmt(cap())+'</b>')+item('Lewati waktu','Produksi dan aktivitas dunia berjalan per hari.','',button('Majukan 1 hari','day:1')+button('Majukan 7 hari','day:7'))+'</div>')+'</div>'}
function army(){let units=UNITS.map(u=>{let c=Object.fromEntries(Object.entries(u.cost).map(([k,v])=>[k,v*25]));return item(u.icon+' '+u.name,u.desc+'<br>Kekuatan/unit: '+u.power+' • Konsumsi/hari: '+u.upkeep+' makanan<br>Biaya 25 unit: '+costText(c),'<b>'+fmt(S.units[u.id]||0)+'</b> unit',button('Latih 25','recruit:'+u.id, !canPay(c)||S.units[u.id]>100000,'good')+button('Latih 100','recruit100:'+u.id,!canPay(Object.fromEntries(Object.entries(c).map(([k,v])=>[k,v*4])))||S.units[u.id]>100000,'good'))}).join('');return '<div class="layout">'+card('⚔️ Barak dan Pasukan','<p class="muted">Kekuatan total: <b class="gold">'+fmt(power())+'</b>. Pasukan mengonsumsi makanan setiap hari.</p><div class="stack">'+units+'</div>')+card('📋 Kondisi Militer','<div class="stack">'+item('Total personel','Jumlah seluruh pasukan aktif.','<b>'+fmt(Object.values(S.units).reduce((a,b)=>a+b,0))+'</b>')+item('Pasukan terluka','Pasukan yang dapat dipulihkan.','<b>'+fmt(S.wounded)+'</b>')+item('Kapasitas barak','Batas lunak pelatihan: '+fmt(5000*S.buildings.barracks)+' unit.','<b>Lv. '+S.buildings.barracks+'</b>')+item('Jenderal aktif','Jenderal yang ditugaskan memimpin tentara.','<b>'+S.generals.filter(g=>g.assigned==='army').length+'</b>')+'</div>')+'</div>'}
function generals(){return '<div class="layout">'+card('🎖️ Daftar Jenderal','<p class="muted">Jenderal memberi bonus kekuatan dan pertahanan. Naikkan level mereka lewat kemenangan perang.</p><div class="stack">'+S.generals.map(g=>item('🎖️ '+g.name+' <span class="badge">'+g.rank+'</span>','Level '+g.level+' • ATK '+g.attack+' • DEF '+g.defense+' • Loyalitas '+g.loyalty+'%<div class="bar"><i style="width:'+Math.min(100,g.xp%100)+'%"></i></div>Pengalaman: '+g.xp+' XP', '<span class="gold">Lv.'+g.level+'</span>',button(g.assigned==='army'?'Pimpin tentara':'Tugaskan ke tentara','assign:'+g.id,g.assigned==='army','primary')+button('Latih jenderal (120 emas)','train:'+g.id,S.res.gold<120))) .join('')+'</div>')+card('📜 Rekrut Jenderal','Rekrut perwira baru untuk memperkuat kepemimpinan militer. Setiap jenderal memiliki statistik yang berbeda.',button('Rekrut jenderal • 350 emas','newgen',S.res.gold<350,'primary')+'<p class="muted">Batas jenderal: '+(2+S.buildings.castle*2)+'.</p>')+'</div>'}
function research(){return '<div class="layout">'+card('🔬 Teknologi Kerajaan',S.buildings.academy===0?'<div class="notice">Bangun Akademi terlebih dahulu untuk membuka penelitian.</div>':'<p class="muted">Teknologi memberikan bonus permanen bagi kerajaan.</p><div class="stack">'+RESEARCH.map(r=>{let lv=S.research[r.id]||0,c=Object.fromEntries(Object.entries(r.cost).map(([k,v])=>[k,Math.ceil(v*(1+lv*.8))]));return item(r.name+' <span class="badge">Lv. '+lv+'/'+r.max+'</span>',r.desc+'<br>Biaya: '+costText(c),'',button(lv>=r.max?'Maksimum':'Teliti','research:'+r.id,lv>=r.max||!canPay(c),'primary'))}).join('')+'</div>')+card('📈 Efek Riset','<div class="stack">'+RESEARCH.map(r=>item(r.name,'Level saat ini: '+(S.research[r.id]||0)+'/'+r.max,'<b class="gold">'+(S.research[r.id]||0)+'</b>')).join('')+'</div>')+'</div>'}
function world(){return '<div class="notice">Ada '+S.enemies.length+' kerajaan AI. Pilih jumlah tiap jenis pasukan saat menyerang; pasukan yang tidak dikirim tetap menjaga kerajaan.</div><div class="layout">'+card('🌍 Kerajaan Tetangga','<div class="stack">'+S.enemies.map(e=>{let p=e.power;return item('🏰 '+e.name+' <span class="badge">'+e.relation+'</span>','Perkiraan kekuatan: '+fmt(p)+'<br>Wilayah: '+e.territory+' • Perbendaharaan: '+fmt(e.wealth)+' emas<br><span class="muted">Perbandingan: '+(power()>=p*1.25?'<span class="green">Unggul</span>':power()<p*.8?'<span class="red">Berbahaya</span>':'Seimbang')+'</span>', '<b class="gold">'+fmt(p)+'</b>',button('Intai','scout:'+e.id)+button('Atur pasukan & serang','attack:'+e.id,false,'danger')+button('Kirim utusan','diplomacy:'+e.id,S.res.gold<80))}).join('')+'</div>')+card('🧭 Ekspedisi dan Monster','Kirim ekspedisi untuk mengumpulkan sumber daya. Ekspedisi memakai makanan dan memajukan waktu satu hari.',item('Ekspedisi kayu','Mendapatkan kayu.','',button('Kirim ekspedisi','gather:wood'))+item('Ekspedisi batu','Mendapatkan batu.','',button('Kirim ekspedisi','gather:stone'))+item('Ekspedisi bijih','Mendapatkan bijih.','',button('Kirim ekspedisi','gather:ore'))+item('Berburu monster','Hadiah emas, bijih, dan pengalaman jenderal.','',button('Mulai perburuan','hunt'))+'</div>')+'</div>'}
function guild(){let g=S.guild;return '<div class="layout">'+card('🏴 Guild Kerajaan',g.name?'<div class="stack">'+item('Nama guild',g.name,'<span class="badge">Lv. '+g.level+'</span>')+item('Anggota','Anggota AI akan berkontribusi secara berkala.','<b>'+g.members+'</b>')+item('Kontribusi','Kontribusi terkumpul untuk pengembangan guild.','<b>'+fmt(g.contribution)+'</b>')+item('Aksi guild','Perkuat pengaruh guild dan dukung operasi militer.','',button('Kontribusi 100 emas','guildcon',S.res.gold<100)+button('Perluas guild','guildup',S.res.gold<400,'primary')+button('Bubar guild','guildleave',false,'danger'))+'</div>':'<p class="muted">Bentuk guild untuk mendapatkan bantuan dan bonus aktivitas kerajaan.</p><input id="guildName" maxlength="24" placeholder="Nama guild" style="width:100%;padding:10px;background:#0d1726;color:white;border:1px solid var(--line);border-radius:8px;margin-bottom:8px">'+button('Buat guild • 250 emas','guildcreate',S.res.gold<250,'primary'))+card('🤝 Manfaat Guild','<div class="stack">'+item('Bantuan pembangunan','Guild level 2+ mengurangi biaya bangunan sebesar 3%.','')+item('Dukungan militer','Kontribusi guild meningkatkan bonus kekuatan kecil.','')+item('Anggota AI','Jumlah anggota bertambah seiring level guild.','')+'</div>')+'</div>'}
function reports(){return card('📜 Riwayat Kerajaan','<div class="log">'+S.reports.map(r=>'<div class="logline">'+r+'</div>').join('')+'</div>'+button('Bersihkan laporan','clearlogs',false,'danger'))}
function render(){resourceHeader();tabs();let html=({kingdom,army,generals,research,world,guild,reports})[S.activeTab]();$('#view').innerHTML=html;$('#view').querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act(b.dataset.act));$('#saveBtn').onclick=()=>{save();$('#saveStatus').textContent='Game berhasil disimpan.'};$('#resetBtn').onclick=()=>{if(confirm('Mulai ulang kerajaan dari awal? Data simpanan game ini akan diganti.')){S=fresh();save();render()}}}
function act(a){let [cmd,arg]=a.split(':');if(cmd==='day'){advance(+arg);save();return}if(cmd==='build'){let b=BUILDINGS.find(x=>x.id===arg),lv=S.buildings[arg]||0,c=Object.fromEntries(Object.entries(b.cost).map(([k,v])=>[k,Math.ceil(v*(1+lv*.72))]));if(!pay(c))return;if(arg!=='castle'&&lv>=S.buildings.castle+2){alert('Tingkatkan Kastil untuk membuka batas level bangunan.');return}S.buildings[arg]=lv+1;log((lv?'Peningkatan':'Pembangunan')+' '+b.name+' selesai.');}
else if(cmd==='recruit'||cmd==='recruit100'){let u=UNITS.find(x=>x.id===arg),n=cmd==='recruit100'?100:25,c=Object.fromEntries(Object.entries(u.cost).map(([k,v])=>[k,v*n]));if(!pay(c))return;S.units[arg]=(S.units[arg]||0)+n;log(n+' '+u.name+' berhasil dilatih.')}
else if(cmd==='assign'){let g=S.generals.find(x=>x.id===+arg);g.assigned=g.assigned==='army'?'none':'army';log(g.name+(g.assigned==='army'?' ditugaskan memimpin tentara.':' ditarik dari komando tentara.'))}
else if(cmd==='train'){let g=S.generals.find(x=>x.id===+arg);if(!pay({gold:120}))return;g.xp+=60;if(g.xp>=g.level*100){g.xp-=g.level*100;g.level++;g.attack+=2;g.defense+=2;log(g.name+' naik ke level '+g.level+'!')}else log(g.name+' menyelesaikan latihan.')}
else if(cmd==='newgen'){if(S.generals.length>=2+S.buildings.castle*2){alert('Batas jenderal tercapai. Tingkatkan Kastil.');return}if(!pay({gold:350}))return;let name=GEN_NAMES[Math.floor(Math.random()*GEN_NAMES.length)];if(S.generals.some(g=>g.name===name))name+=' '+(S.nextGen);S.generals.push({id:S.nextGen++,name,rank:'Komandan',level:1,xp:0,attack:7+Math.floor(Math.random()*5),defense:6+Math.floor(Math.random()*5),loyalty:75+Math.floor(Math.random()*25),assigned:'none'});log('Jenderal '+name+' bergabung dengan kerajaan.')}
else if(cmd==='research'){let r=RESEARCH.find(x=>x.id===arg),lv=S.research[arg]||0,c=Object.fromEntries(Object.entries(r.cost).map(([k,v])=>[k,Math.ceil(v*(1+lv*.8))]));if(S.buildings.academy===0||lv>=r.max||!pay(c))return;S.research[arg]=lv+1;log('Riset '+r.name+' mencapai level '+(lv+1)+'.')}
else if(cmd==='scout'){let e=S.enemies.find(x=>x.id===+arg);log('Intelijen '+e.name+': kekuatan '+fmt(e.power)+', wilayah '+e.territory+', hubungan '+e.relation+'.');alert('LAPORAN PENGINTAIAN\n'+e.name+'\nKekuatan: '+fmt(e.power)+'\nWilayah: '+e.territory+'\nPerkiraan emas: '+fmt(e.wealth));}
else if(cmd==='attack'){
let e=S.enemies.find(x=>x.id===+arg);if(!e)return;
const sent={};for(const u of UNITS){let available=S.units[u.id]||0;let raw=prompt('Serangan ke '+e.name+'\\n'+u.name+' tersedia: '+fmt(available)+'\\nBerapa yang dikirim?',String(available));if(raw===null)return;let n=Number(raw);if(!Number.isFinite(n)||n<0||!Number.isInteger(n)||n>available){alert('Jumlah '+u.name+' tidak valid. Masukkan bilangan bulat dari 0 sampai '+available+'.');return}sent[u.id]=n}
let totalSent=Object.values(sent).reduce((a,b)=>a+b,0);if(totalSent<1){alert('Tuan harus mengirim minimal 1 pasukan.');return}
let sentPower=UNITS.reduce((a,u)=>a+sent[u.id]*u.power,0);let genBonus=S.generals.filter(g=>g.assigned==='army').reduce((a,g)=>a+g.attack*2+g.defense,0);sentPower=Math.floor((sentPower+genBonus)*(1+(S.research.drill||0)*.08));
if(!confirm('Kirim '+fmt(totalSent)+' pasukan menyerang '+e.name+'?\\nInfanteri: '+fmt(sent.infantry)+'\\nPemanah: '+fmt(sent.archer)+'\\nKavaleri: '+fmt(sent.cavalry)+'\\nPengepungan: '+fmt(sent.siege)))return;
let our=sentPower*(.88+Math.random()*.24),their=e.power*(.88+Math.random()*.24),won=our>=their;
let lossRate=won?.06+Math.random()*.10:.18+Math.random()*.22;
let enemyLossRate=won?.12+Math.random()*.18:.025+Math.random()*.07;
const lossBy={},deadBy={},woundedBy={};let losses=0,dead=0,wounded=0;
for(const u of UNITS){const n=sent[u.id],l=Math.min(n,Math.floor(n*lossRate*(u.id==='siege'?1.15:1))),save=Math.min(l,Math.floor(l*(S.buildings.hospital*.025+(S.research.medicine||0)*.05)));lossBy[u.id]=l;woundedBy[u.id]=save;deadBy[u.id]=l-save;losses+=l;wounded+=save;dead+=l-save;S.units[u.id]-=l}
S.wounded+=wounded;
const enemyCasualties=Math.min(Math.floor(e.power/2),Math.floor((e.power/Math.max(1,UNITS.reduce((a,u)=>a+u.power,0)))*totalSent*enemyLossRate*2.4));
e.power=Math.max(250,Math.floor(e.power*(won?.68:.91)));e.wealth=Math.max(0,e.wealth-(won?Math.floor(e.wealth*.12):0));S.res.gold+=won?Math.floor(e.wealth*.18):Math.floor(e.wealth*.03);
if(won){S.territories++;e.territory=Math.max(1,e.territory-1);addRes('wood',Math.floor(50+Math.random()*100));addRes('stone',Math.floor(35+Math.random()*70))}
S.generals.filter(g=>g.assigned==='army').forEach(g=>{g.xp+=won?90:45;if(g.xp>=g.level*100){g.xp-=g.level*100;g.level++;g.attack+=2;g.defense+=1;log('Jenderal '+g.name+' naik ke level '+g.level+'.')}});
const lines=UNITS.map(u=>u.name+': dikirim '+fmt(sent[u.id])+', korban permanen '+fmt(deadBy[u.id])+', terluka '+fmt(woundedBy[u.id])).join('\\n');
const report='LAPORAN PERANG — '+e.name+'\\nHasil: '+(won?'KEMENANGAN':'KEKALAHAN')+'\\nKekuatan pasukan dikirim: '+fmt(our)+'\\nKekuatan musuh: '+fmt(their)+'\\n\\nPASUKAN KITA\\n'+lines+'\\nTotal dikirim: '+fmt(totalSent)+'\\nKorban permanen: '+fmt(dead)+'\\nTerluka: '+fmt(wounded)+'\\n\\nPerkiraan korban musuh: '+fmt(enemyCasualties)+'\\nWilayah: '+(won?'berhasil direbut (+1)':'tidak berubah');
log('Perang melawan '+e.name+': '+(won?'MENANG':'KALAH')+'. Dikirim '+fmt(totalSent)+'; korban permanen '+fmt(dead)+'; terluka '+fmt(wounded)+'; korban musuh diperkirakan '+fmt(enemyCasualties)+'.');
log(lines.replaceAll('\\n',' | '));
S.reports.unshift(report.replaceAll('\\n',' • '));S.reports=S.reports.slice(0,100);
alert(report);advance(1);
}
else if(cmd==='diplomacy'){let e=S.enemies.find(x=>x.id===+arg);if(!pay({gold:80}))return;e.relation='Bersahabat';e.power=Math.max(250,e.power-25);log('Utusan berdiplomasi dengan '+e.name+'. Hubungan membaik, tetapi tidak menjamin perdamaian permanen.')}
else if(cmd==='gather'){if(!pay({food:40}))return;let gain=arg==='wood'?160:arg==='stone'?125:75;addRes(arg,gain);advance(1);log('Ekspedisi kembali membawa '+fmt(gain)+' '+arg+'.')}
else if(cmd==='hunt'){if(!pay({food:100}))return;let p=power(),difficulty=500+Math.random()*1200,win=p>difficulty*.8;if(win){S.res.gold+=180;addRes('ore',45);S.generals.filter(g=>g.assigned==='army').forEach(g=>g.xp+=45);log('Perburuan monster berhasil. Kerajaan mendapat emas dan bijih.')}else{let total=Object.values(S.units).reduce((a,b)=>a+b,0),loss=Math.floor(total*.035);S.units.infantry=Math.max(0,S.units.infantry-loss);S.wounded+=Math.floor(loss*.4);log('Perburuan monster gagal. Pasukan mengalami kerugian.')}advance(1)}
else if(cmd==='guildcreate'){let name=$('#guildName')?.value.trim();if(!name){alert('Masukkan nama guild.');return}if(!pay({gold:250}))return;S.guild={name,members:5,level:1,contribution:0};log('Guild '+name+' didirikan dengan 5 anggota awal.')}
else if(cmd==='guildcon'){if(!pay({gold:100}))return;S.guild.contribution+=100;log('Kerajaan menyumbang 100 emas kepada guild.')}
else if(cmd==='guildup'){if(S.guild.level>=10){alert('Guild sudah mencapai level maksimum.');return}if(!pay({gold:400}))return;S.guild.level++;S.guild.members=Math.min(50,S.guild.members+3);log('Guild naik ke level '+S.guild.level+' dan merekrut anggota baru.')}
else if(cmd==='guildleave'){if(confirm('Yakin ingin membubarkan guild?')){S.guild={name:'',members:0,level:1,contribution:0};log('Guild dibubarkan.')}}else if(cmd==='clearlogs'){S.reports=[];log('Catatan laporan dibersihkan.')}
save();render()}
setInterval(()=>{if(Date.now()-S.lastTick>=120000){tick();save();render()}},15000);
render();
})();
</script></body></html>
