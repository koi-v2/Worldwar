<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>YTMP3 — Worldwar</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#0b1020;color:#eef2ff;font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:#111a30;border-bottom:1px solid #293653}
.brand{font-size:19px;font-weight:800;letter-spacing:.3px}.brand span{color:#65d6ad}
.open{display:inline-block;padding:10px 13px;border-radius:10px;background:#65d6ad;color:#082019;text-decoration:none;font-weight:750;white-space:nowrap}
.note{max-width:900px;margin:12px auto;padding:0 14px;color:#aab7d3;font-size:13px}
.frame-wrap{height:calc(100dvh - 112px);min-height:520px;margin:0 auto;max-width:1100px;padding:0 10px 12px}
iframe{display:block;width:100%;height:100%;border:1px solid #293653;border-radius:14px;background:white}
@media(max-width:480px){header{padding:12px}.brand{font-size:17px}.frame-wrap{height:calc(100dvh - 125px);min-height:470px;padding:0 6px 8px}.note{font-size:12px}}
</style>
</head>
<body>
<header>
  <div class="brand">YTMP3 <span>· Worldwar</span></div>
  <a class="open" href="https://yttmp3.com.co/" target="_blank" rel="noopener noreferrer">Buka Situs Asli ↗</a>
</header>
<div class="note">Halaman resmi dimuat di bawah agar memakai layanan dan backend milik situs tersebut. Jika tidak tampil karena situs melarang iframe, tekan “Buka Situs Asli”.</div>
<main class="frame-wrap">
  <iframe src="https://yttmp3.com.co/" title="Situs resmi YTMP3" loading="eager" referrerpolicy="strict-origin-when-cross-origin" allow="clipboard-read; clipboard-write"></iframe>
</main>
</body>
</html>
