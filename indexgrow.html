<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Grow World</title><style>
*{box-sizing:border-box}body{margin:0;background:#101923;color:#eef5fb;font:14px system-ui;padding:10px}.wrap{max-width:960px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.title{font-weight:900;font-size:22px}.title span{color:#8fe2a3}.info{font-size:12px;color:#b9cbd8}canvas{display:block;width:100%;height:auto;border:2px solid #3d5d70;border-radius:10px;background:#8ad0ef;image-rendering:pixelated;touch-action:none;margin-top:10px}.controls{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 0}.group{display:flex;gap:9px}button{border:1px solid #526c80;border-radius:12px;background:#203448;color:white;padding:12px;font:inherit;min-height:50px;touch-action:none}button.move{width:60px;font-size:22px;font-weight:900}button.jump{background:#285c40}button.active{background:#b28a47;color:#17130b}.hint{font-size:11px;color:#a9bdcc;line-height:1.6}.bar{display:flex;gap:7px;flex-wrap:wrap}.bar button{min-height:38px;padding:8px 10px;font-size:12px}
</style></head><body><div class="wrap"><div class="top"><div><div class="title">🌱 GROW <span>WORLD</span></div><div class="info">Prototype 01 · game platformer 2D</div></div><div class="info">📍 <b id="pos">0, 0</b> · 🧱 <b id="blocks">0</b> blok tanah</div></div><canvas id="game" width="960" height="540" aria-label="Dunia platformer pixel 2D"></canvas><div class="controls"><div class="group"><button class="move" id="left">◀</button><button class="move" id="right">▶</button><button class="jump" id="jump">⬆ LOMPAT</button></div><div class="hint">HP: tahan ◀ ▶ untuk jalan · ⬆ untuk lompat<br>PC: A/D atau ←/→, Space/W/↑ untuk lompat</div></div><div class="bar"><button id="reset">↻ Kembali ke awal</button><button id="grid">▦ Grid: OFF</button><button id="extend">＋ Tambah tanah</button><span class="info" id="status">Jelajahi dunia!</span></div></div>
<script>
(()=>{const c=document.getElementById('game'),g=c.getContext('2d'),T=32,H=540;let width=180,ground=[],plants=[],cam=0,grid=false,jump=false,keys={left:false,right:false},last=0;const p={x:140,y:200,w:22,h:29,vx:0,vy:0,face:1,on:false};const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));function gen(from=0,to=width){let h=12;for(let x=from;x<to;x++){if(Math.random()<.26)h+=Math.random()<.5?-1:1;h=clamp(h,9,15);ground[x]=h}plants=[];for(let x=0;x<width;x++)if(Math.random()<.14)plants.push({x,type:Math.random()<.5?0:1,col:['#ffdb70','#f4a6c8','#fff'][Math.floor(Math.random()*3)]});document.getElementById('blocks').textContent=ground.reduce((n,h)=>n+22-h,0)}function solid(tx,ty){if(tx<0||tx>=width||ty>=22)return ty>=22;return ty>=0&&ground[tx]!==undefined&&ty>=ground[tx]}function hit(x,y,w,h){for(let yy=Math.floor(y/T);yy<=Math.floor((y+h-1)/T);yy++)for(let xx=Math.floor(x/T);xx<=Math.floor((x+w-1)/T);xx++)if(solid(xx,yy))return true;return false}function reset(){p.x=140;p.y=(ground[Math.floor(p.x/T)]-1)*T-p.h;p.vx=p.vy=0;p.on=true;cam=0}function upd(dt){p.vx=((keys.right?1:0)-(keys.left?1:0))*210;if(p.vx)p.face=Math.sign(p.vx);if(jump&&p.on){p.vy=-460;p.on=false;document.getElementById('status').textContent='Melompat!'}jump=false;p.vy=Math.min(780,p.vy+1150*dt);let nx=p.x+p.vx*dt;if(!hit(nx,p.y,p.w,p.h))p.x=clamp(nx,0,width*T-p.w);else p.vx=0;let ny=p.y+p.vy*dt;p.on=false;if(!hit(p.x,ny,p.w,p.h))p.y=ny;else{if(p.vy>0){p.y=Math.floor((p.y+p.h)/T)*T-p.h;p.on=true}else p.y=Math.ceil(p.y/T)*T;p.vy=0}if(p.y>H+100){p.x=Math.max(0,p.x-80);p.y=20;p.vy=0}cam=clamp(p.x-400,0,width*T-960);document.getElementById('pos').textContent=Math.floor(p.x/T)+', '+Math.floor(p.y/T)}function draw(){g.clearRect(0,0,960,H);let sky=g.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#7bc8ee');sky.addColorStop(1,'#d4f0d8');g.fillStyle=sky;g.fillRect(0,0,960,H);for(let i=0;i<7;i++){let x=((i*183-cam*.16)%(1100)+1100)%1100-50,y=50+(i%3)*45;g.fillStyle='#ffffffb8';g.fillRect(x,y,60,14);g.fillRect(x+13,y-9,27,14);g.fillRect(x+38,y-4,26,12)}g.fillStyle='#8fcda0';g.beginPath();g.moveTo(0,H);for(let x=0;x<=960;x+=8)g.lineTo(x,350+Math.sin((x+cam*.23)*.009)*30);g.lineTo(960,H);g.fill();let a=Math.max(0,Math.floor(cam/T)-1),b=Math.min(width,Math.ceil((cam+960)/T)+1);for(let x=a;x<b;x++){let sx=Math.floor(x*T-cam),y=ground[x]*T;g.fillStyle='#7c4a2c';g.fillRect(sx,y,T,H-y);g.fillStyle='#9a6038';g.fillRect(sx,y+5,T-1,H-y-5);g.fillStyle='#4d9b45';g.fillRect(sx,y,T,8);g.fillStyle='#72c85a';g.fillRect(sx,y,T,3);g.fillStyle='#b87949';g.fillRect(sx+5,y+14,5,4);if(grid){g.strokeStyle='#263d384d';for(let yy=ground[x];yy<22;yy++)g.strokeRect(sx,yy*T,T,T)}}for(const d of plants){if(d.x<a||d.x>=b)continue;let x=d.x*T-cam,y=ground[d.x]*T;if(!d.type){g.fillStyle='#347f42';g.fillRect(x+15,y-4,2,9);g.fillStyle=d.col;g.fillRect(x+11,y-8,5,5);g.fillRect(x+16,y-8,5,5);g.fillRect(x+13,y-12,5,5)}else{g.fillStyle='#2f8746';g.fillRect(x+10,y-5,4,7);g.fillRect(x+5,y-9,7,5);g.fillRect(x+15,y-10,8,5)}}let x=Math.round(p.x-cam),y=Math.round(p.y);\n// Custom original chibi hero: white hair, dark outfit, crimson scarf and red eyes\ng.fillStyle='#244d3955';g.fillRect(x-5,y+p.h-1,p.w+10,5);\n// boots and legs\ng.fillStyle='#25283b';g.fillRect(x+3,y+23,7,5);g.fillRect(x+12,y+23,7,5);g.fillStyle='#111827';g.fillRect(x+1,y+27,9,3);g.fillRect(x+11,y+27,9,3);g.fillStyle='#66718a';g.fillRect(x+3,y+23,5,2);g.fillRect(x+12,y+23,5,2);\n// dark tunic and coat tails\ng.fillStyle='#252b40';g.fillRect(x+3,y+12,16,12);g.fillRect(x+1,y+17,4,7);g.fillRect(x+17,y+17,4,7);g.fillStyle='#454c67';g.fillRect(x+5,y+13,12,7);g.fillStyle='#a92d45';g.fillRect(x+10,y+13,3,10);g.fillRect(x+7,y+20,9,2);\n// arms and pale hands\ng.fillStyle='#f0c8b4';g.fillRect(x,y+15,4,6);g.fillRect(x+18,y+15,4,6);g.fillStyle='#30364d';g.fillRect(x,y+13,5,5);g.fillRect(x+17,y+13,5,5);\n// face\ng.fillStyle='#f3cdb8';g.fillRect(x+4,y+3,14,11);g.fillRect(x+2,y+6,3,5);g.fillRect(x+17,y+6,3,5);\n// layered silver-white hair silhouette\ng.fillStyle='#d7dfef';g.fillRect(x+3,y+1,15,5);g.fillRect(x+1,y+3,5,6);g.fillRect(x+14,y+2,6,7);g.fillRect(x+5,y-2,10,5);g.fillStyle='#f4f6ff';g.fillRect(x+5,y-1,8,3);g.fillRect(x+3,y+2,5,4);g.fillRect(x+12,y+2,5,4);g.fillStyle='#aab8d4';g.fillRect(x+2,y+7,3,5);g.fillRect(x+16,y+7,3,4);\n// eyes look in the direction of travel\ng.fillStyle='#8f1f3b';g.fillRect(x+(p.face>0?13:6),y+7,3,3);g.fillStyle='#ff6a83';g.fillRect(x+(p.face>0?14:6),y+7,1,1);g.fillStyle='#4a2635';g.fillRect(x+8,y+12,5,1);\n// small crimson scarf fluttering behind\ng.fillStyle='#b92e49';g.fillRect(x+(p.face>0?1:16),y+11,5,3);g.fillRect(x+(p.face>0?0:17),y+14,4,4);}function loop(t){let dt=Math.min(.032,(t-last)/1000||0);last=t;upd(dt);draw();requestAnimationFrame(loop)}function press(n,v){keys[n]=v;document.getElementById(n).classList.toggle('active',v)}for(const n of ['left','right']){let el=document.getElementById(n);el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);press(n,true)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>el.addEventListener(ev,()=>press(n,false)))}document.getElementById('jump').addEventListener('pointerdown',e=>{e.preventDefault();jump=true});window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp',' ','a','A','d','D','w','W'].includes(e.key))e.preventDefault();if(['ArrowLeft','a','A'].includes(e.key))press('left',true);if(['ArrowRight','d','D'].includes(e.key))press('right',true);if(['ArrowUp','w','W',' '].includes(e.key)&&!e.repeat)jump=true});window.addEventListener('keyup',e=>{if(['ArrowLeft','a','A'].includes(e.key))press('left',false);if(['ArrowRight','d','D'].includes(e.key))press('right',false)});window.addEventListener('blur',()=>{press('left',false);press('right',false)});c.addEventListener('pointerdown',e=>{let r=c.getBoundingClientRect(),x=(e.clientX-r.left)*960/r.width+cam,tx=Math.floor(x/T);if(tx>=0&&tx<width){p.x=tx*T;p.y=(ground[tx]-1)*T-p.h;p.vy=0;p.on=true;document.getElementById('status').textContent='Pindah ke tanah'}});document.getElementById('reset').onclick=reset;document.getElementById('grid').onclick=e=>{grid=!grid;e.target.textContent='▦ Grid: '+(grid?'ON':'OFF');e.target.classList.toggle('active',grid)};document.getElementById('extend').onclick=()=>{let old=width;width=Math.min(500,width+40);gen(old,width);document.getElementById('status').textContent='Tanah ditambahkan!'};gen();reset();requestAnimationFrame(loop)})();
</script></body></html>
