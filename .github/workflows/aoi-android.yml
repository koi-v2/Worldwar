name: Build KoiWorld Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'growtopia/**'
      - '.github/workflows/growtopia-android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        working-directory: growtopia
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KoiWorld-Android-APK
          path: growtopia/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
