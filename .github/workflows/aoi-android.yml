name: Build Koi World Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'aoi_native/**'
      - '.github/workflows/aoi-android.yml'

jobs:
  export-android:
    name: Export Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false

      - name: Install Android SDK tools
        uses: android-actions/setup-android@v3

      - name: Install Android build packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmdline-tools;latest"
          yes | sdkmanager --licenses

      - name: Install Godot export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz -O /tmp/godot-templates.tpz
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          cp -r /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.4.1.stable/"

      - name: Create Android export preset
        working-directory: aoi_native
        run: |
          cat > export_presets.cfg <<'EOF'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="../KoiWorld-android-debug.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false
          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          gradle_build/export_format=0
          package/unique_name="com.koiv2.koiworld"
          package/name="Koi World"
          package/signed=true
          package/app_category=2
          package/retain_data_on_uninstall=false
          package/exclude_from_recents=false
          package/show_in_android_tv=false
          package/disable નetwork_state=false
          permissions/internet=true
          EOF
          sed -i 's/package\/disable નetwork_state=false/package\/disable_network_state=false/' export_presets.cfg

      - name: Export debug APK
        working-directory: aoi_native
        run: |
          godot --headless --editor --path . --quit
          godot --headless --path . --export-debug "Android" ../KoiWorld-android-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KoiWorld-Android-APK
          path: KoiWorld-android-debug.apk
          if-no-files-found: error
          retention-days: 14
