<rect x="9" y="32" width="4" height="2" fill="#77839d"/><rect x="19" y="32" width="4" height="2" fill="#77839d"/>
<!-- legs -->
<rect x="10" y="27" width="4" height="5" fill="#30364d"/><rect x="19" y="27" width="4" height="5" fill="#30364d"/>
<!-- coat -->
<rect x="8" y="17" width="16" height="12" fill="#252b40"/><rect x="6" y="20" width="4" height="8" fill="#252b40"/><rect x="22" y="20" width="4" height="8" fill="#252b40"/>
<rect x="10" y="18" width="12" height="8" fill="#3b435d"/><rect x="15" y="18" width="3" height="10" fill="#b92e49"/>
<rect x="12" y="27" width="9" height="2" fill="#151a2a"/><rect x="13" y="21" width="2" height="3" fill="#d9b65c"/>
