<rect x="11" y="7" width="4" height="3" fill="#d9e1f2"/><rect x="17" y="7" width="5" height="2" fill="#d9e1f2"/>
<rect x="12" y="11" width="3" height="3" fill="#8f1f3b"/><rect x="19" y="11" width="3" height="3" fill="#8f1f3b"/>
<rect x="13" y="11" width="1" height="1" fill="#ff8ba0"/><rect x="20" y="11" width="1" height="1" fill="#ff8ba0"/>
<rect x="15" y="15" width="4" height="1" fill="#9a5862"/>
