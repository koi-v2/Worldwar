<rect x="10" y="7" width="13" height="10" fill="#f0c8b4"/><rect x="8" y="10" width="3" height="5" fill="#e4b39f"/><rect x="22" y="10" width="3" height="5" fill="#e4b39f"/>
<!-- white/silver hair silhouette -->
<rect x="8" y="4" width="16" height="8" fill="#d9e1f2"/><rect x="10" y="2" width="12" height="5" fill="#f5f7ff"/>
<rect x="6" y="6" width="5" height="10" fill="#d9e1f2"/><rect x="21" y="5" width="5" height="10" fill="#c1cce3"/>
<rect x="8" y="11" width="3" height="5" fill="#b2bfd9"/><rect x="22" y="10" width="3" height="5" fill="#aab8d4"/>
<rect x="12" y="4" width="3" height="3" fill="#ffffff"/><rect x="17" y="3" width="4" height="3" fill="#ffffff"/>
