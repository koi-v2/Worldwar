<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Kontol - Pixel Platformer</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#100b19;color:#f4d9ff;font:14px system-ui;display:flex;min-height:100dvh;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px}h1{font-size:18px;margin:0}#game{width:min(96vw,900px);height:auto;aspect-ratio:16/9;border:2px solid #8054a3;background:#21162c;image-rendering:pixelated;touch-action:none}.help{opacity:.8;text-align:center;font-size:12px}.controls{display:flex;gap:12px;align-items:center;justify-content:center;width:min(96vw,500px)}button,label{background:#39234b;color:white;border:1px solid #ad75d3;border-radius:12px;padding:14px 18px;font-weight:700;touch-action:none}button:active{background:#7a3e9c}#sheet{max-width:90vw;font-size:12px;padding:8px}
</style></head><body>
<h1>⚔️ KONTOL — Pixel Platformer</h1>
<canvas id="game" width="960" height="540"></canvas>
<div class="help">Sprite Rogue otomatis dimuat dari file PNG di repositori. Jika belum muncul, pilih PNG secara manual. PC: A/D atau ←/→, Space lompat, J serang.</div>
<label id="pick">Pilih PNG manual (opsional) <input id="sheet" type="file" accept="image/*" style="display:block"></label>
<div class="controls"><button id="left">◀</button><button id="jump">JUMP</button><button id="attack">⚔ SERANG</button><button id="right">▶</button></div>
<script>
const c=document.getElementById('game'),x=c.getContext('2d');x.imageSmoothingEnabled=false;
const img=new Image();let ready=false;
img.onload=()=>{ready=true;};
img.onerror=()=>{ready=false;};
img.src='https://raw.githubusercontent.com/koi-v2/Worldwar/main/file_0000000037688207a4add9825c674ab4.png';
document.getElementById('sheet').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;ready=false;img.src=URL.createObjectURL(f)});
const p={x:120,y:390,vx:0,vy:0,w:48,h:70,face:1,ground:true,act:'idle',tick:0,attack:0};
const keys={};let touchL=false,touchR=false;
function bind(id,fn){const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();fn(true)});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,e=>fn(false)))}
bind('left',v=>touchL=v);bind('right',v=>touchR=v);bind('jump',v=>{if(v&&p.ground){p.vy=-470;p.ground=false}});bind('attack',v=>{if(v&&p.attack<=0)p.attack=0.34});
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if([' ','arrowleft','arrowright'].includes(e.key.toLowerCase()))e.preventDefault();if((e.key===' '||e.key.toLowerCase()==='w'||e.key.toLowerCase()==='arrowup')&&p.ground){p.vy=-470;p.ground=false}if(e.key.toLowerCase()==='j'&&p.attack<=0)p.attack=.34});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function drawSprite(sx,sy,sw,sh,flip=false){if(!ready)return false;x.save();if(flip){x.translate(p.x+p.w,p.y);x.scale(-1,1);x.drawImage(img,sx,sy,sw,sh,0,0,p.w,p.h)}else{x.drawImage(img,sx,sy,sw,sh,p.x,p.y,p.w,p.h)}x.restore();return true}
function frame(){
 const dt=Math.min(.033,(frame.last?performance.now()-frame.last:16)/1000);frame.last=performance.now();
 const l=keys.a||keys.arrowleft||touchL,r=keys.d||keys.arrowright||touchR;p.vx=(r?1:0)-(l?1:0);if(p.vx)p.face=Math.sign(p.vx);p.x+=p.vx*220*dt;p.vy+=1100*dt;p.y+=p.vy*dt;
 const floor=460-p.h;if(p.y>=floor){p.y=floor;p.vy=0;p.ground=true}p.x=Math.max(0,Math.min(960-p.w,p.x));p.attack=Math.max(0,p.attack-dt);p.tick+=dt;
 x.clearRect(0,0,960,540);const g=x.createLinearGradient(0,0,0,540);g.addColorStop(0,'#21152f');g.addColorStop(1,'#40244b');x.fillStyle=g;x.fillRect(0,0,960,540);
 x.fillStyle='#2d1b39';for(let i=0;i<8;i++){x.fillRect(i*140-20,335+(i%3)*24,100,125)}
 x.fillStyle='#a45b9e';x.fillRect(0,460,960,80);x.fillStyle='#d78bd1';for(let i=0;i<960;i+=32)x.fillRect(i,460,18,4);
 x.fillStyle='#f4d9ff';x.font='16px system-ui';x.fillText('MOVE  •  JUMP  •  SWORD',20,30);
 if(!ready){
   const px=Math.round(p.x),py=Math.round(p.y);
   x.fillStyle='#21152f';x.fillRect(px+11,py+3,26,18);
   x.fillStyle='#eadfef';x.fillRect(px+14,py+8,20,13);
   x.fillStyle='#d9bfae';x.fillRect(px+15,py+9,18,17);
   x.fillStyle='#171020';x.fillRect(px+18,py+14,4,4);x.fillRect(px+27,py+14,4,4);
   x.fillStyle='#8060a0';x.fillRect(px+12,py+26,24,19);
   x.fillStyle='#c7b3db';x.fillRect(px+7,py+27,8,18);x.fillRect(px+33,py+27,8,18);
   x.fillStyle='#3b2850';x.fillRect(px+13,py+44,9,21);x.fillRect(px+27,py+44,9,21);
 } else {
   // Koordinat frame dipetakan ke panel animasi yang benar pada sprite sheet 1536x1024.
   // Setiap frame dipotong terpisah agar tidak mengambil garis panel/karakter sebelah.
   const frames={
     idle:[
       [350,58,94,145],[470,58,94,145],[590,58,94,145],[710,58,94,145]
     ],
     run:[
       [815,62,108,145],[932,62,108,145],[1049,62,108,145],
       [1166,62,108,145],[1283,62,108,145],[1400,62,108,145]
     ],
     jump:[
       [365,270,100,165],[485,255,100,165],[610,250,100,165],[735,275,100,160]
     ],
     attack:[
       [322,478,112,158],[440,478,112,158],[558,478,112,158],[676,478,112,158]
     ]
   };
   let list,idx;
   if(p.attack>0){
     list=frames.attack;idx=Math.min(list.length-1,Math.floor((.34-p.attack)/(.34/list.length)));
   }else if(!p.ground){
     list=frames.jump;idx=Math.floor(p.tick*7)%list.length;
   }else if(Math.abs(p.vx)>.1){
     list=frames.run;idx=Math.floor(p.tick*10)%list.length;
   }else{
     list=frames.idle;idx=Math.floor(p.tick*4)%list.length;
   }
   const [sx,sy,sw,sh]=list[idx];
   drawSprite(sx,sy,sw,sh,p.face<0);
 }
 x.fillStyle='#f4d9ff';x.font='13px system-ui';x.fillText('← → bergerak     SPACE lompat     J tebas',20,515);
 requestAnimationFrame(frame)
}requestAnimationFrame(frame);
</script></body></html>
